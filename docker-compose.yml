services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: routes
      POSTGRES_PASSWORD: routes
      POSTGRES_DB: routedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routes -d routedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://routes:routes@db:5432/routedb
      ENABLE_SCHEDULER: "true"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: